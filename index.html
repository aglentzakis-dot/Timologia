<script>
"use strict";

/* =========================================================================
   ΤΙΜΟΛΟΓΙΑ ΠΡΟΜΗΘΕΥΤΩΝ — αυτόνομη εφαρμογή (ένα αρχείο, χωρίς διακομιστή)
   Αποθήκευση: κοινός φάκελος (συγχρονισμένος μέσω Google Drive) μέσω File
   System Access API — ένα αρχείο ανά τιμολόγιο/πληρωμή, για να μη χάνεται
   τίποτα όταν γράφουν ταυτόχρονα δύο συσκευές. Τεχνητή νοημοσύνη: δωρεάν
   κλειδί OpenRouter (χωρίς κάρτα), όπως στο Identify-AI.
   ========================================================================= */

const APP_VERSION = "1.1.0";
const DEFAULT_PIN = "1111";
const DEFAULT_MODEL = "openrouter/free:free";
const FALLBACK_MODELS = [
  "openrouter/free:free",
  "qwen/qwen2.5-vl-72b-instruct:free",
  "meta-llama/llama-3.2-11b-vision-instruct:free",
  "google/gemini-2.0-flash-exp:free"

/* ---------------------------- Εμφάνιση (θέμα) ---------------------------- */

const THEME_PRESETS = [
  {name:"Πράσινο",  accent:"#2f6f4f"},
  {name:"Μπλε",     accent:"#2a5fa5"},
  {name:"Καφέ",     accent:"#8a5a2b"},
  {name:"Μελιτζανί",accent:"#6b3fa0"},
  {name:"Κεραμιδί", accent:"#b5542a"}
];
const DEFAULT_THEME = {mode:"light", accent:"#2f6f4f"};

function hexToRgb(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||"");
  if(!m) return {r:47,g:111,b:79};
  return {r:parseInt(m[1],16), g:parseInt(m[2],16), b:parseInt(m[3],16)};
}
function shade(hex, pct){
  const {r,g,b} = hexToRgb(hex);
  const f = (c)=> Math.max(0, Math.min(255, Math.round(c + (pct<0? c*pct/100 : (255-c)*pct/100))));
  return "#" + [f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function applyTheme(){
  const t = state.config.theme || DEFAULT_THEME;
  const root = document.documentElement.style;
  const accent = t.accent || DEFAULT_THEME.accent;
  if(t.mode === "dark"){
    root.setProperty("--bg", "#17191b");
    root.setProperty("--panel", "#222527");
    root.setProperty("--ink", "#eef0ee");
    root.setProperty("--muted", "#9aa29c");
    root.setProperty("--line", "#33373a");
  } else {
    root.setProperty("--bg", "#f6f5f2");
    root.setProperty("--panel", "#ffffff");
    root.setProperty("--ink", "#1f2420");
    root.setProperty("--muted", "#6b756d");
    root.setProperty("--line", "#dfe2de");
  }
  root.setProperty("--accent", accent);
  root.setProperty("--accent-ink", "#ffffff");
  document.body.style.background = "var(--bg)";
  document.body.style.color = "var(--ink)";
}

/* ---------------------------- Βοηθητικά ---------------------------- */

function uid(prefix){
  return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
}
function normalizeForMatch(s){
  if(!s) return "";
  return s.toString().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .toUpperCase().replace(/[^A-ZΑ-Ω0-9]/gi,"");
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){
  n = Number(n)||0;
  return n.toLocaleString("el-GR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso + (iso.length<=10?"T00:00:00":""));
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("el-GR",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function escapeHtml(s){
  return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg, ms){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), ms||2600);
}

/* ---------------------------- Τοπική αποθήκη ---------------------------- */

const LS = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v==null?fallback:JSON.parse(v); }catch(e){ return fallback; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
};

/* ---------------------------- Κοινός φάκελος (IndexedDB handle) ---------------------------- */

function openHandleDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open("shared-backups", 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore("handles"); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbGet(key){
  const db = await openHandleDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("handles","readonly");
    const req = tx.objectStore("handles").get(key);
    req.onsuccess = ()=>resolve(req.result||null);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await openHandleDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("handles","readwrite");
    tx.objectStore("handles").put(val, key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

let rootDirHandle = null;   // κοινός φάκελος (ο ίδιος για όλες τις εφαρμογές)
let appDirHandle = null;    // υποφάκελος "Timologia"
let invDirHandle = null, payDirHandle = null;
let folderReady = false;

async function ensureSubdir(parent, name){
  return await parent.getDirectoryHandle(name, {create:true});
}

async function tryAutoConnectFolder(){
  try{
    const handle = await idbGet("root");
    if(!handle) return false;
    const perm = await handle.queryPermission({mode:"readwrite"});
    if(perm !== "granted") return false; // θα ζητηθεί ξανά όταν πατήσει κάτι ο χρήστης
    rootDirHandle = handle;
    appDirHandle = await ensureSubdir(rootDirHandle, "Timologia");
    invDirHandle = await ensureSubdir(appDirHandle, "invoices");
    payDirHandle = await ensureSubdir(appDirHandle, "payments");
    folderReady = true;
    return true;
  }catch(e){ return false; }
}

async function connectFolder(){
  if(!window.showDirectoryPicker){
    toast("Ο browser αυτός δεν υποστηρίζει κοινό φάκελο· θα δουλέψουμε μόνο τοπικά.");
    return false;
  }
  try{
    let handle = await idbGet("root");
    if(handle){
      const perm = await handle.requestPermission({mode:"readwrite"});
      if(perm === "granted"){
        rootDirHandle = handle;
      }
    }
    if(!rootDirHandle){
      rootDirHandle = await window.showDirectoryPicker({id:"backups", mode:"readwrite", startIn:"downloads"});
      await idbSet("root", rootDirHandle);
    }
    appDirHandle = await ensureSubdir(rootDirHandle, "Timologia");
    invDirHandle = await ensureSubdir(appDirHandle, "invoices");
    payDirHandle = await ensureSubdir(appDirHandle, "payments");
    folderReady = true;
    toast("Ο κοινός φάκελος συνδέθηκε.");
    return true;
  }catch(e){
    console.error(e);
    toast("Η σύνδεση του φακέλου ακυρώθηκε ή απέτυχε.");
    return false;
  }
}

async function writeJsonFile(dirHandle, filename, data){
  const fh = await dirHandle.getFileHandle(filename, {create:true});
  const ws = await fh.createWritable();
  await ws.write(JSON.stringify(data, null, 2));
  await ws.close();
}
async function readAllJsonFiles(dirHandle){
  const out = [];
  if(!dirHandle) return out;
  for await (const [name, handle] of dirHandle.entries()){
    if(handle.kind !== "file" || !name.endsWith(".json")) continue;
    try{
      const file = await handle.getFile();
      const text = await file.text();
      const obj = JSON.parse(text);
      obj.__file = name;
      out.push(obj);
    }catch(e){ /* αγνοούμε κατεστραμμένο αρχείο */ }
  }
  return out;
}
async function writeConfigFile(cfg){
  if(!appDirHandle) return;
  try{ await writeJsonFile(appDirHandle, "config.json", cfg); }catch(e){}
}
async function readConfigFile(){
  if(!appDirHandle) return null;
  try{
    const fh = await appDirHandle.getFileHandle("config.json", {create:false});
    const file = await fh.getFile();
    return JSON.parse(await file.text());
  }catch(e){ return null; }
}

/* ---------------------------- Κατάσταση εφαρμογής ---------------------------- */

const state = {
  screen: "home",              // home | supplier | add | settings
  unlocked: LS.get("tim_unlocked", false),
  currentStaff: LS.get("tim_currentStaff", null),
  config: LS.get("tim_config", {
    adminPin: DEFAULT_PIN,
    vatRates: [6, 13, 24],
    staff: [],
    apiKey: "",
    model: DEFAULT_MODEL,
    theme: DEFAULT_THEME
  }),
  invoices: LS.get("tim_invoices_local", []),   // τοπικά μόνο (fallback χωρίς φάκελο)
  payments: LS.get("tim_payments_local", []),
  openSupplierKey: null,
  sheet: null,                 // ποιο bottom-sheet είναι ανοιχτό
  busy: false,
  busyMsg: ""
};

function persistLocal(){
  LS.set("tim_unlocked", state.unlocked);
  LS.set("tim_currentStaff", state.currentStaff);
  LS.set("tim_config", state.config);
}

/* Συγχώνευση: αρχεία κοινού φακέλου + τοπικά (fallback) χωρίς διπλοεγγραφές */
let folderInvoices = [];
let folderPayments = [];

async function syncFromFolder(){
  if(!folderReady) return;
  try{
    folderInvoices = await readAllJsonFiles(invDirHandle);
    folderPayments = await readAllJsonFiles(payDirHandle);
    const cfg = await readConfigFile();
    if(cfg){
      // Οι ρυθμίσεις του κοινού αρχείου υπερισχύουν (τις διαχειρίζεται ο διαχειριστής)
      state.config.adminPin = cfg.adminPin || state.config.adminPin;
      state.config.vatRates = cfg.vatRates || state.config.vatRates;
      state.config.staff = cfg.staff || state.config.staff;
      persistLocal();
    }
  }catch(e){ console.error(e); }
}

function allInvoices(){
  const ids = new Set();
  const out = [];
  for(const inv of folderInvoices){ if(!ids.has(inv.id)){ ids.add(inv.id); out.push(inv); } }
  for(const inv of state.invoices){ if(!ids.has(inv.id)){ ids.add(inv.id); out.push(inv); } }
  return out.sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
}
function allPayments(){
  const ids = new Set();
  const out = [];
  for(const p of folderPayments){ if(!ids.has(p.id)){ ids.add(p.id); out.push(p); } }
  for(const p of state.payments){ if(!ids.has(p.id)){ ids.add(p.id); out.push(p); } }
  return out.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
}

function suppliersSummary(){
  const map = new Map();
  for(const inv of allInvoices()){
    const key = normalizeForMatch(inv.supplierName);
    if(!key) continue;
    if(!map.has(key)) map.set(key, {
      key, name: inv.supplierName, phone:"", afm:"", address:"", email:"",
      invoices: [], totalInvoiced: 0
    });
    const s = map.get(key);
    s.invoices.push(inv);
    s.totalInvoiced += Number(inv.grossAmount)||0;
    // πιο πρόσφατα στοιχεία επικάλυψης (το τελευταίο τιμολόγιο με τιμή κερδίζει)
    if(inv.phone) s.phone = inv.phone;
    if(inv.afm) s.afm = inv.afm;
    if(inv.address) s.address = inv.address;
    if(inv.email) s.email = inv.email;
    if(inv.supplierName) s.name = inv.supplierName;
  }
  for(const p of allPayments()){
    const key = normalizeForMatch(p.supplierName);
    if(!map.has(key)) map.set(key, {key, name:p.supplierName, phone:"",afm:"",address:"",email:"", invoices:[], totalInvoiced:0});
    map.get(key).totalPaid = (map.get(key).totalPaid||0) + (Number(p.amount)||0);
  }
  const list = Array.from(map.values()).map(s=>{
    s.totalPaid = s.totalPaid||0;
    s.balance = Math.round((s.totalInvoiced - s.totalPaid)*100)/100;
    s.invoices.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    return s;
  });
  list.sort((a,b)=> b.balance - a.balance || a.name.localeCompare(b.name,"el"));
  return list;
}

function supplierPayments(key){
  return allPayments().filter(p=>normalizeForMatch(p.supplierName)===key);
}

/* Κατανομή πληρωμής: παλαιότερο τιμολόγιο πρώτα */
function invoiceRemaining(inv, payments){
  // Απλή λογική προβολής: το άθροισμα πληρωμών "επί πιστώσει" για τον προμηθευτή
  // αφαιρείται διαδοχικά από τα παλαιότερα τιμολόγια. Εδώ υπολογίζουμε συγκεντρωτικά
  // στο suppliersSummary (balance), οπότε ανά τιμολόγιο δείχνουμε απλά κατάσταση.
  return inv;
}

/* ---------------------------- OpenRouter: εξαγωγή δεδομένων τιμολογίου ---------------------------- */

async function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

 "email": "email εκδότη αν υπάρχει",
 "date": "ημερομηνία έκδοσης σε μορφή YYYY-MM-DD",
 "netAmount": αριθμός καθαρής αξίας χωρίς ΦΠΑ,
 "vatAmount": αριθμός συνολικού ΦΠΑ,
 "vatRate": αριθμός κύριου συντελεστή ΦΠΑ (π.χ. 13 ή 24, χωρίς το % σύμβολο),
 "grossAmount": αριθμός τελικού συνόλου πληρωμής,
 "hasQr": true/false αν υπάρχει QR κωδικός στο παραστατικό,
 "amountConfident": true/false αν είσαι σίγουρος για το συνολικό ποσό,
 "supplierConfident": true/false αν είσαι σίγουρος για το όνομα του προμηθευτή
}
Αν κάποιο πεδίο δεν φαίνεται καθαρά, βάλε 0 για αριθμούς ή κενό string για κείμενο, αλλά βάλε το αντίστοιχο confident σε false.
Μην γράψεις τίποτα άλλο εκτός από το JSON.`;

async function callOpenRouterVision(dataUrl, apiKey, model){
  const body = {
    model: model,
    messages: [{
      role: "user",
      content: [
        {type:"text", text: EXTRACTION_PROMPT},
        {type:"image_url", image_url:{url: dataUrl}}
      ]
    }],
    temperature: 0.1
  };
  const resp = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + apiKey,
      "Content-Type": "application/json",
      "X-Title": "Invoice-Tracker-App"
    },
    body: JSON.stringify(body)
  });
  if(!resp.ok){
    const t = await resp.text().catch(()=>"");
    throw new Error("HTTP " + resp.status + " " + t.slice(0,200));
  }
  const data = await resp.json();
  const text = data?.choices?.[0]?.message?.content || "";
  return text;
}

function parseJsonLoose(text){
  let t = text.trim();
  t = t.replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  const start = t.indexOf("{");
  const end = t.lastIndexOf("}");
  if(start>=0 && end>start) t = t.slice(start, end+1);
  return JSON.parse(t);
}

async function extractInvoiceData(file){
  const apiKey = state.config.apiKey;
  if(!apiKey) throw new Error("NO_API_KEY");
  const dataUrl = await fileToDataUrl(file);
  const modelsToTry = [state.config.model].concat(FALLBACK_MODELS.filter(m=>m!==state.config.model));
  let lastErr = null;
  for(const model of modelsToTry){
    try{
      const text = await callOpenRouterVision(dataUrl, apiKey, model);
      const parsed = parseJsonLoose(text);
      return {parsed, dataUrl, modelUsed: model};
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("Αποτυχία εξαγωγής δεδομένων.");
}

function renderSheet(){
  const s = state.sheet;
  let inner = "";
  let center = false;
  if(s.type === "add-invoice") inner = sheetAddInvoiceHtml(s);
  else if(s.type === "payment") inner = sheetPaymentHtml(s);
  else if(s.type === "pin"){ inner = sheetPinHtml(s); center = true; }
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay" + (center?" center-sheet":"");
  overlay.innerHTML = `<div class="sheet"><div class="sheet-handle"></div>${inner}</div>`;
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) closeSheet(); });
  document.body.appendChild(overlay);
}

function closeSheet(){
  state.sheet = null;
  document.querySelectorAll(".sheet-overlay").forEach(e=>e.remove());
  render();
}

function bindEvents(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    const act = el.getAttribute("data-act");
    if(el.tagName === "INPUT" && el.type === "file"){
      el.addEventListener("change", (e)=>onFileChosen(e.target.files[0]));
      return;
    }
    el.addEventListener("click", (e)=>handleAction(act, el, e));
  });
}

async function handleAction(act, el){
  switch(act){
    case "lock":
      state.unlocked = false; state.currentStaff = null; persistLocal(); render(); break;
    case "pick-staff":
      state.currentStaff = el.getAttribute("data-name"); persistLocal(); render(); break;
    case "staff-continue":
      state.unlocked = true; persistLocal(); render();
      openAddInvoiceSheet(); break;
    case "admin-login":
      state.sheet = {type:"pin", pin:"", error:false}; render(); break;
    case "pin-digit":
      {
        const d = el.getAttribute("data-d");
        state.sheet.pin = (state.sheet.pin||"") + d;
        state.sheet.error = false;
        if(state.sheet.pin.length === 4){
          if(state.sheet.pin === state.config.adminPin){
            state.unlocked = true; state.currentStaff = "Διαχειριστής";
            persistLocal();
            closeSheet();
            return;
          } else {
            state.sheet.error = true;
            setTimeout(()=>{ state.sheet.pin=""; state.sheet.error=false; render(); }, 650);
          }
        }
        render();
      } break;
    case "pin-clear":
      state.sheet.pin = ""; state.sheet.error = false; render(); break;
    case "close-sheet": closeSheet(); break;
    case "go-home": state.screen="home"; state.sheet=null; render(); break;
    case "go-settings": state.screen="settings"; state.sheet=null; render(); break;
    case "open-add": openAddInvoiceSheet(); break;
    case "open-supplier":
      state.openSupplierKey = el.getAttribute("data-key");
      state.screen = "supplier"; render(); break;
    case "open-payment":
      state.sheet = {type:"payment", key: el.getAttribute("data-key")}; render(); break;
    case "copy":
      try{ await navigator.clipboard.writeText(el.getAttribute("data-val")); toast("Αντιγράφηκε."); }
      catch(e){ toast("Δεν ήταν δυνατή η αντιγραφή."); } break;
    case "connect-folder":
      await connectFolder();
      await syncFromFolder();
      render(); break;
    case "save-ai":
      state.config.apiKey = document.getElementById("f-apikey").value.trim();
      state.config.model = document.getElementById("f-model").value.trim() || DEFAULT_MODEL;
      persistLocal(); await writeConfigFile(state.config); toast("Αποθηκεύτηκε."); break;
    case "add-vat":
      {
        const v = Number(document.getElementById("f-newvat").value);
        if(v>0 && !state.config.vatRates.includes(v)){
          state.config.vatRates.push(v); persistLocal(); await writeConfigFile(state.config);
        }
        render();
      } break;
    case "del-vat":
      state.config.vatRates.splice(Number(el.getAttribute("data-i")),1);
      persistLocal(); await writeConfigFile(state.config); render(); break;
    case "move-vat": moveItem(state.config.vatRates, Number(el.getAttribute("data-i")), el.getAttribute("data-dir"));
      persistLocal(); await writeConfigFile(state.config); render(); break;
    case "add-staff":
      {
        const v = document.getElementById("f-newstaff").value.trim();
        if(v && !state.config.staff.includes(v)){
          state.config.staff.push(v); persistLocal(); await writeConfigFile(state.config);
        }
        render();
      } break;
    case "del-staff":
      state.config.staff.splice(Number(el.getAttribute("data-i")),1);
      persistLocal(); await writeConfigFile(state.config); render(); break;
    case "move-staff": moveItem(state.config.staff, Number(el.getAttribute("data-i")), el.getAttribute("data-dir"));
      persistLocal(); await writeConfigFile(state.config); render(); break;
    case "save-pin":
      {
        const v = document.getElementById("f-pin").value.trim();
        if(/^\d{4}$/.test(v)){
          state.config.adminPin = v; persistLocal(); await writeConfigFile(state.config); toast("Ο κωδικός άλλαξε.");
        } else toast("Ο κωδικός πρέπει να έχει 4 ψηφία.");
        render();
      } break;
    case "pick-accent":
      document.getElementById("f-theme-accent").value = el.getAttribute("data-accent"); break;
    case "save-theme":
      {
        const mode = document.getElementById("f-theme-mode").value;
        const accent = document.getElementById("f-theme-accent").value;
        state.config.theme = {mode, accent};
        persistLocal(); await writeConfigFile(state.config);
        applyTheme(); toast("Η εμφάνιση αποθηκεύτηκε.");
      } break;
    case "export-excel": exportInvoicesToExcel(); break;
    case "check-update": location.href = location.pathname + "?v=" + Date.now(); break;
    case "manual-entry":
      state.sheet.step = "confirm"; state.sheet.extracted = {date: todayISO()}; render(); break;
    case "retry-capture":
      state.sheet.step = "capture"; render(); break;
    case "save-invoice": await saveInvoiceFromForm(); break;
    case "save-payment": await savePaymentFromForm(el.getAttribute("data-key")); break;
  }
}

function moveItem(arr, i, dir){
  const j = dir==="up" ? i-1 : i+1;
  if(j<0 || j>=arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
}

async function onFileChosen(file){
  if(!file) return;
  state.sheet.file = file;
  state.sheet.step = "loading";
  render();
  try{
    const dataUrl = await fileToDataUrl(file);
    const {parsed} = await extractInvoiceData(file);
    state.sheet.extracted = parsed;
    state.sheet.dataUrl = dataUrl;
    state.sheet.step = "confirm";
  }catch(e){
    console.error(e);
    state.sheet.step = "error";
    state.sheet.errorMsg = (e && e.message === "NO_API_KEY")
      ? "Δεν έχει καταχωρηθεί κλειδί OpenRouter στις Ρυθμίσεις."
      : ("Η ανάλυση απέτυχε: " + (e && e.message ? e.message : "άγνωστο σφάλμα"));
  }
  render();
}

async function saveInvoiceFromForm(){
  const inv = {
    id: uid("inv"),
    supplierName: document.getElementById("f-supplier").value.trim(),
    date: document.getElementById("f-date").value || todayISO(),
    afm: document.getElementById("f-afm").value.trim(),
    phone: document.getElementById("f-phone").value.trim(),
    email: document.getElementById("f-email").value.trim(),
    address: document.getElementById("f-address").value.trim(),
    netAmount: Number(document.getElementById("f-net").value)||0,
    vatAmount: Number(document.getElementById("f-vat").value)||0,
    vatRate: Number(document.getElementById("f-vatrate").value)||0,
    grossAmount: Number(document.getElementById("f-gross").value)||0,
    paymentType: document.getElementById("f-paytype").value,
    who: state.currentStaff || "",
    createdAt: Date.now()
  };
  if(!inv.supplierName){ toast("Συμπλήρωσε το όνομα προμηθευτή."); return; }
  if(folderReady){
    try{ await writeJsonFile(invDirHandle, inv.id + ".json", inv); }
    catch(e){ console.error(e); state.invoices.push(inv); LS.set("tim_invoices_local", state.invoices); }
  } else {
    state.invoices.push(inv); LS.set("tim_invoices_local", state.invoices);
  }
  if(folderReady) folderInvoices.push(inv);
  closeSheet();
  state.screen = "home";
  toast("Το τιμολόγιο αποθηκεύτηκε.");
  render();
}

async function savePaymentFromForm(key){
  const supplier = suppliersSummary().find(x=>x.key===key);
  const amount = Number(document.getElementById("f-pay-amount").value)||0;
  if(amount<=0){ toast("Βάλε ένα έγκυρο ποσό."); return; }
  const p = {
    id: uid("pay"),
    supplierName: supplier ? supplier.name : "",
    amount,
    date: document.getElementById("f-pay-date").value || todayISO(),
    note: document.getElementById("f-pay-note").value.trim(),
    createdAt: Date.now()
  };
  if(folderReady){
    try{ await writeJsonFile(payDirHandle, p.id + ".json", p); }
    catch(e){ state.payments.push(p); LS.set("tim_payments_local", state.payments); }
  } else {
    state.payments.push(p); LS.set("tim_payments_local", state.payments);
  }
  if(folderReady) folderPayments.push(p);
  closeSheet();
  toast("Η πληρωμή καταχωρήθηκε.");
  render();
}

function exportInvoicesToExcel(){
  const invoices = allInvoices();
  if(!invoices.length){ toast("Δεν υπάρχουν τιμολόγια για εξαγωγή."); return; }
  const rows = invoices.map(inv=>({
    "Προμηθευτής": inv.supplierName,
    "ΑΦΜ": inv.afm||"",
    "Ημερομηνία": fmtDate(inv.date),
    "Καθαρή αξία": inv.netAmount||0,
    "ΦΠΑ": inv.vatAmount||0,
    "Συντελεστής ΦΠΑ": inv.vatRate?inv.vatRate+"%":"",
    "Σύνολο": inv.grossAmount||0,
    "Τρόπος πληρωμής": inv.paymentType||"",
    "Καταχωρήθηκε από": inv.who||""
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Τιμολόγια");
  XLSX.writeFile(wb, "Τιμολόγια_Προμηθευτών_" + todayISO() + ".xlsx");
}

/* ============================= Εκκίνηση ============================= */

function migrateConfig(){
  if(!state.config.vat6Added){
    if(!state.config.vatRates.includes(6)) state.config.vatRates.unshift(6);
    state.config.vat6Added = true;
    persistLocal();
  }
}

async function boot(){
  migrateConfig();
  applyTheme();
  await tryAutoConnectFolder();
  if(folderReady) await syncFromFolder();
  applyTheme();
  render();
  // Περιοδικό ανανέωση για να φαίνονται τιμολόγια που πρόσθεσε άλλη συσκευή
  // μέσω του συγχρονισμού του Google Drive.
  setInterval(async ()=>{
    if(!folderReady) return;
    await syncFromFolder();
    if(state.unlocked && (state.screen==="home" || state.screen==="supplier")) render();
  }, 25000);
}
boot();

</script>
